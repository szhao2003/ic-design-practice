name: Validate project

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      upload_pages_artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:questions -- --release
      - run: npm run test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test published Python reference
        run: npm run test:python
      - name: Install HDL simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: Simulate all published reference modules
        run: npm run test:rtl
      - run: npm run build
      - name: Upload validated site
        if: inputs.upload_pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
